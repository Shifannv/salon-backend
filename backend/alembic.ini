[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
# Revision policy lives in app/core/migration_policy.py. This URL is not execution approval.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/salon_platform

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
