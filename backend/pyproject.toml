[project]
name = "salon-platform-api"
version = "0.1.0"
description = "FastAPI backend for the salon customer and barber apps."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "email-validator>=2.2.0",
  "fastapi>=0.112.0",
  "greenlet>=3.0.0",
  "httpx>=0.27.0",
  "passlib>=1.7.4",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.32",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
  "pytest-asyncio>=0.23.8",
  "pytest>=8.3.2",
  "ruff>=0.5.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "FURB157", "UP017"]
