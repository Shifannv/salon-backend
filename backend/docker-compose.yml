services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SALON_API_IMAGE:-salon-platform-api:latest}
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      PORT: "${PORT:-8000}"
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
