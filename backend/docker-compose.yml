services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SALON_API_IMAGE:-salon-platform-api:latest}
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment: &app-environment
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      PORT: "${PORT:-8000}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  notification-worker:
    image: ${SALON_API_IMAGE:-salon-platform-api:latest}
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    command: ["python", "-m", "app.infrastructure.push.outbox_worker"]
    environment: *app-environment
    # The image's HTTP health check belongs to the API, not this polling process.
    healthcheck:
      disable: true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  media-cleanup:
    image: ${SALON_API_IMAGE:-salon-platform-api:latest}
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    command: ["python", "-m", "app.infrastructure.media.cleanup_worker"]
    environment: *app-environment
    healthcheck:
      disable: true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  account-deletion-worker:
    image: ${SALON_API_IMAGE:-salon-platform-api:latest}
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    command: ["python", "-m", "app.infrastructure.account_deletion.worker"]
    environment: *app-environment
    healthcheck:
      disable: true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  payment-webhook-worker:
    image: ${SALON_API_IMAGE:-salon-platform-api:latest}
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    command: ["python", "-m", "app.infrastructure.payments.webhook_worker"]
    environment: *app-environment
    # Dormant but harmless while PAYMENT_PROVIDER=none: it idles on an empty queue.
    healthcheck:
      disable: true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Reachable only by services on the Compose network.
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
