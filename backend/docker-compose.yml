services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: salon-platform-api:latest
    container_name: salon-platform-api
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
