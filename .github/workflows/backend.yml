name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: local
      MIGRATION_TEST_DB: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check app tests migrations
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: python -m pytest -q

  image:
    name: Build and smoke test image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build release image
        run: |
          image="salon-platform-api:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_IMAGE=$image" >> "$GITHUB_ENV"
          docker build --pull --tag "$image" backend
      - name: Verify non-root runtime and custom port
        run: |
          test "$(docker run --rm --entrypoint id "$RELEASE_IMAGE" -u)" != 0
          docker run -d --name ci-api -e ENVIRONMENT=local -e PORT=8080 \
            -p 127.0.0.1:8080:8080 "$RELEASE_IMAGE"
          curl --fail --silent --show-error --retry 20 --retry-delay 2 \
            --retry-connrefused --retry-max-time 90 http://127.0.0.1:8080/health
      - name: Container logs on failure
        if: failure()
        run: docker logs ci-api 2>&1 || true
      - name: Remove smoke test container
        if: always()
        run: docker rm -f ci-api 2>/dev/null || true
      - name: Package tested release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p release/scripts
          printf '%s\n' "$RELEASE_IMAGE" > release/image-ref
          docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE" > release/image-id
          docker save "$RELEASE_IMAGE" | gzip > release/image.tar.gz
          cp backend/docker-compose.yml release/
          cp backend/scripts/gcp-vm-{deploy,release,release-compose}.sh release/scripts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: vm-release
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy:
    name: Deploy production VM
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://apiv1.mudassirmhd.in
    concurrency:
      group: production-vm
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: vm-release
          path: release
      - name: Reject superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "This release has been superseded on main. Deploy the latest main run."
            exit 1
          fi
      - name: Configure verified SSH access
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          test -n "$VM_SSH_KEY" && test -n "$VM_KNOWN_HOSTS"
          [[ "$VM_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VM_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host production-vm
            HostName $VM_HOST
            User $VM_USER
            Port 22
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Transfer tested release
        run: |
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          ssh production-vm "mkdir -p ~/salon-backend/releases/$release_id"
          scp -r release/. "production-vm:salon-backend/releases/$release_id/"
      - name: Apply reviewed migrations and deploy services
        run: ssh production-vm "bash ~/salon-backend/releases/$RELEASE_ID/scripts/gcp-vm-release.sh"
      - name: Verify public HTTPS health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --max-time 15 https://apiv1.mudassirmhd.in/health
      - name: Remove runner SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
