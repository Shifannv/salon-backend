name: Backend CI

on:
  workflow_call:
  pull_request:
  push:
permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SALON_ENV_FILE: /nonexistent/salon-ci-env
      DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:5432/postgres
      MIGRATION_TEST_DB: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
      PORTABLE_CI_TARGET: 0037_customer_processing_charge
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Verify explicit portable migration policy (no prepared Mumbai execution)
        run: python -m pytest -q tests/unit/test_migration_policy.py
      - run: python -m ruff check app tests migrations scripts/docker_image_ids.py scripts/cloud_run_candidate.py
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: portable-ci-test-results
          path: backend/test-results.xml
          if-no-files-found: error

  image:
    name: Build and smoke test image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build release image
        run: |
          image="salon-platform-api:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_IMAGE=$image" >> "$GITHUB_ENV"
          docker build --pull --platform linux/amd64 --tag "$image" backend
      - name: Validate deployment Compose configuration
        run: |
          COMPOSE_ENV_FILE=.env.gcp.example docker compose \
            --env-file backend/.env.gcp.example -f backend/docker-compose.yml config --quiet
      - name: Verify non-root runtime and custom port
        run: bash backend/scripts/check-container.sh "$RELEASE_IMAGE"
