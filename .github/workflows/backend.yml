name: Backend CI

on:
  workflow_call:
    inputs:
      publish_deployment_image:
        type: boolean
        required: false
        default: false
    outputs:
      image_artifact_id:
        value: ${{ jobs.image.outputs.artifact_id }}
      image_artifact_digest:
        value: ${{ jobs.image.outputs.artifact_digest }}
  workflow_dispatch:
  pull_request:
  push:
permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SALON_ENV_FILE: /nonexistent/salon-ci-env
      DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:5432/postgres
      MIGRATION_TEST_DB: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
      PORTABLE_CI_TARGET: 0037_customer_processing_charge
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Verify explicit portable migration policy (no prepared Mumbai execution)
        run: python -m pytest -q tests/unit/test_migration_policy.py
      - run: python -m ruff check app tests migrations scripts/docker_image_ids.py scripts/cloud_run_candidate.py scripts/cloud_run_auto.py scripts/ci_image_bundle.py
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        if: always()
        # Diagnostic report only; pytest's exit code remains authoritative.
        continue-on-error: true
        with:
          name: portable-ci-test-results
          path: backend/test-results.xml
          if-no-files-found: error
          retention-days: 1

  image:
    name: Build and smoke test image
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build release image
        run: |
          image="salon-platform-api:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_IMAGE=$image" >> "$GITHUB_ENV"
          docker build --pull --platform linux/amd64 --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag "$image" backend
      - name: Validate deployment Compose configuration
        run: |
          COMPOSE_ENV_FILE=.env.gcp.example docker compose \
            --env-file backend/.env.gcp.example -f backend/docker-compose.yml config --quiet
      - name: Verify non-root runtime and custom port
        run: bash backend/scripts/check-container.sh "$RELEASE_IMAGE" "$GITHUB_SHA"
      - name: Export the exact tested image and provenance
        if: inputs.publish_deployment_image && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 backend/scripts/ci_image_bundle.py create "$RELEASE_IMAGE" ci-bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        id: bundle
        if: inputs.publish_deployment_image && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ci-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-bundle/*
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
