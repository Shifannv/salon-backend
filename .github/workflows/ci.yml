name: CI

on:
  workflow_call:
  push:
    branches: [main, preview, hafiz]
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "ruff>=0.5.7"
      - working-directory: backend
        run: ruff check --no-cache app tests migrations scripts

  test:
    name: Pytest
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        env:
          APP_NAME: Salon Platform API
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_JWKS_URL: https://test.supabase.co/auth/v1/.well-known/jwks.json
          SUPABASE_JWT_AUDIENCE: authenticated
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
        run: pytest -p no:cacheprovider --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.xml
          retention-days: 30

  container:
    name: Docker and deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Validate Compose using template settings
        env:
          COMPOSE_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config --quiet
      - name: Build API and worker image
        run: docker build --pull -t salon-platform-api:ci .
      - name: Smoke test image
        run: bash scripts/check-container.sh salon-platform-api:ci
