name: Cloud Run production candidate

# Retained as a notice, not a second production release path.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Manual production path is disabled
        run: echo 'Production release requires a reviewed main merge, successful CI and the production AUTO_DEPLOY_ENABLED gate. Initial supervised release remains separately blocked.' >> "$GITHUB_STEP_SUMMARY"
