name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # All refs target the same VM; never let two releases update it concurrently.
  group: deploy-gcp-vm
  cancel-in-progress: false

env:
  IMAGE_NAME: salon-platform-api

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve and validate Artifact Registry repository
        id: tags
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: python3 backend/scripts/resolve_artifact_registry.py

      - name: Configure Docker
        env:
          REGISTRY_HOST: ${{ steps.tags.outputs.registry_host }}
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Build image
        working-directory: backend
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          docker build --pull -t "$RELEASE_TAG" .
          bash scripts/check-container.sh "$RELEASE_TAG"

      - name: Push image
        id: image
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          docker push "$RELEASE_TAG"
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$RELEASE_TAG")"
          test -n "$image_ref"
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Sync release Compose file and deploy script
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          source: backend/docker-compose.yml,backend/scripts/gcp-vm-deploy.sh
          target: ./salon-backend
          overwrite: true

      - name: Apply reviewed migrations before updating services
        uses: appleboy/ssh-action@v1
        env:
          SALON_API_IMAGE: ${{ steps.image.outputs.ref }}
          REGISTRY_HOST: ${{ steps.tags.outputs.registry_host }}
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          envs: SALON_API_IMAGE,REGISTRY_HOST
          command_timeout: 10m
          script: |
            set -euo pipefail
            gcloud auth configure-docker "$REGISTRY_HOST" --quiet
            cd ~/salon-backend/backend
            docker compose --env-file .env config --quiet
            docker compose --env-file .env pull api
            docker compose --env-file .env run --rm --no-deps -T api alembic upgrade head

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1
        env:
          SALON_API_IMAGE: ${{ steps.image.outputs.ref }}
          REGISTRY_HOST: ${{ steps.tags.outputs.registry_host }}
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          envs: SALON_API_IMAGE,REGISTRY_HOST
          command_timeout: 10m
          script: |
            set -euo pipefail
            gcloud auth configure-docker "$REGISTRY_HOST" --quiet
            cd ~/salon-backend/backend
            bash scripts/gcp-vm-deploy.sh --pull

      - name: Deployment summary
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          echo "### Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${RELEASE_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Updated API, notification worker, and Redis." >> "$GITHUB_STEP_SUMMARY"
          echo "- Applied reviewed Alembic migrations before updating services." >> "$GITHUB_STEP_SUMMARY"
