name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: salon-platform-api
  REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/salon-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "sha_tag=${REGISTRY}/${IMAGE_NAME}:${short_sha}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${REGISTRY}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: backend
        run: |
          docker build \
            -t "${{ steps.tags.outputs.sha_tag }}" \
            -t "${{ steps.tags.outputs.latest_tag }}" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.tags.outputs.sha_tag }}"
          docker push "${{ steps.tags.outputs.latest_tag }}"

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            set -euo pipefail
            gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet
            cd ~/salon-backend/backend
            export SALON_API_IMAGE="${{ steps.tags.outputs.latest_tag }}"
            docker compose pull api
            docker compose up -d --no-build --remove-orphans api
            docker compose ps
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --max-time 5 http://127.0.0.1:8000/health; then
                exit 0
              fi
              sleep 5
            done
            docker compose logs --tail=100 api
            exit 1

      - name: Deployment summary
        run: |
          echo "### Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.tags.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
